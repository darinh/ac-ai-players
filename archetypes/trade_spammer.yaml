id: trade_spammer
display_name: "Trade Spammer"
display_name_pool:
  - "WTS_Everything"
  - "MarketMagnate"
  - "DerethTrader"
  - "PriceCheckPlz"

description: >
  Marketplace fixture. Spams WTS/WTB lines on a timer. Mostly scripted
